display_information:
  name: prox4
  description: "the bot for #prox4, basically just a forked prox2 "
  background_color: "#1a49d6"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: prox4
    always_online: false
  shortcuts:
    - name: (prox4) Reply
      type: message
      callback_id: reply_anonymous
      description: Reply to a message anonymously
    - name: (prox4) React
      type: message
      callback_id: react_anonymous
      description: React to a message anonymously
  slash_commands:
    - command: /prox4
      url: https://prox4-xi.vercel.app/api/prox2
      description: Submit a confession
      usage_hint: "[message]"
      should_escape: true
    - command: /prox4-revive
      url: https://prox4-xi.vercel.app/api/prox2_revive
      description: Revives unviewed confessions
      should_escape: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - emoji:read
      - files:read
      - files:write
      - im:history
      - im:read
      - im:write
      - mpim:write
      - reactions:write
      - users:read
      - channels:history
      - groups:history
      - groups:read
  pkce_enabled: false
settings:
  event_subscriptions:
    request_url: https://prox4-xi.vercel.app/api/events
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://prox4-xi.vercel.app/api/interaction
    message_menu_options_url: https://prox4-xi.vercel.app/api/emoji_suggest
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  app_level_token_rotation_enabled: false
  is_mcp_enabled: false
